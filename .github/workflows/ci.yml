name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  back-end:
    name: Back end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: back-end
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: renttrace
          POSTGRES_USER: renttrace
          POSTGRES_PASSWORD: renttrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renttrace -d renttrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: renttrace
      DB_USER: renttrace
      DB_PASSWORD: renttrace
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: back-end/requirements*.txt
      - name: Generate throwaway secrets
        run: |
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SIGNING_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Django checks
        run: python manage.py check
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Tests
        run: python manage.py test --parallel

  admin:
    name: Admin app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Generate route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx next build
